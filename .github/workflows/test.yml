name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Für die Tests wird das Electron-Programm selbst nicht gebraucht
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
